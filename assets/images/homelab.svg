<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="The Digital Forge — homelab rack">
  <defs>
    <radialGradient id="glow" cx="28%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="680" height="440" fill="#0a0e14"/>
  <rect width="680" height="440" fill="url(#dots)"/>
  <rect width="680" height="440" fill="url(#glow)"/>

  <!-- rack frame -->
  <rect x="150" y="36" width="252" height="360" rx="14" fill="#0c1119" stroke="#2b3645" stroke-width="4"/>
  <!-- mounting rails -->
  <line x1="166" y1="52" x2="166" y2="380" stroke="#2b3645" stroke-width="6" stroke-dasharray="3 11" stroke-linecap="round"/>
  <line x1="386" y1="52" x2="386" y2="380" stroke="#2b3645" stroke-width="6" stroke-dasharray="3 11" stroke-linecap="round"/>

  <!-- rack units: x 176..376 (w 200), h 44, gap 9, start y 56 -->
  <g>
    <!-- 1: firewall -->
    <g transform="translate(176 56)">
      <rect width="200" height="44" rx="6" fill="#11161f" stroke="#2b3645" stroke-width="2"/>
      <circle cx="20" cy="22" r="4" fill="#5be6c4"/><circle cx="34" cy="22" r="4" fill="#f2a65a"/>
      <g stroke="#2b3645" stroke-width="3" stroke-linecap="round"><line x1="150" y1="15" x2="180" y2="15"/><line x1="150" y1="29" x2="180" y2="29"/></g>
    </g>
    <!-- 2: switch (ports) -->
    <g transform="translate(176 109)">
      <rect width="200" height="44" rx="6" fill="#11161f" stroke="#2b3645" stroke-width="2"/>
      <g fill="#0a0e14" stroke="#5be6c4" stroke-width="1.5">
        <rect x="18" y="16" width="13" height="11" rx="2"/><rect x="35" y="16" width="13" height="11" rx="2"/><rect x="52" y="16" width="13" height="11" rx="2"/><rect x="69" y="16" width="13" height="11" rx="2"/>
        <rect x="86" y="16" width="13" height="11" rx="2"/><rect x="103" y="16" width="13" height="11" rx="2"/><rect x="120" y="16" width="13" height="11" rx="2"/><rect x="137" y="16" width="13" height="11" rx="2"/>
      </g>
      <rect x="166" y="16" width="16" height="11" rx="2" fill="#f2a65a"/>
    </g>
    <!-- 3: node -->
    <g transform="translate(176 162)">
      <rect width="200" height="44" rx="6" fill="#11161f" stroke="#2b3645" stroke-width="2"/>
      <circle cx="20" cy="22" r="4" fill="#5be6c4"/>
      <g stroke="#2b3645" stroke-width="2.5"><line x1="44" y1="14" x2="44" y2="30"/><line x1="54" y1="14" x2="54" y2="30"/><line x1="64" y1="14" x2="64" y2="30"/><line x1="74" y1="14" x2="74" y2="30"/></g>
      <rect x="150" y="14" width="32" height="16" rx="3" fill="#0a0e14" stroke="#2b3645" stroke-width="2"/>
    </g>
    <!-- 4: node -->
    <g transform="translate(176 215)">
      <rect width="200" height="44" rx="6" fill="#11161f" stroke="#2b3645" stroke-width="2"/>
      <circle cx="20" cy="22" r="4" fill="#5be6c4"/>
      <g stroke="#2b3645" stroke-width="2.5"><line x1="44" y1="14" x2="44" y2="30"/><line x1="54" y1="14" x2="54" y2="30"/><line x1="64" y1="14" x2="64" y2="30"/><line x1="74" y1="14" x2="74" y2="30"/></g>
      <rect x="150" y="14" width="32" height="16" rx="3" fill="#0a0e14" stroke="#2b3645" stroke-width="2"/>
    </g>
    <!-- 5: NAS (drive bays) -->
    <g transform="translate(176 268)">
      <rect width="200" height="44" rx="6" fill="#11161f" stroke="#2b3645" stroke-width="2"/>
      <g fill="#0a0e14" stroke="#5be6c4" stroke-width="1.5">
        <rect x="18" y="10" width="22" height="24" rx="2"/><rect x="44" y="10" width="22" height="24" rx="2"/><rect x="70" y="10" width="22" height="24" rx="2"/>
        <rect x="96" y="10" width="22" height="24" rx="2"/><rect x="122" y="10" width="22" height="24" rx="2"/><rect x="148" y="10" width="22" height="24" rx="2"/>
      </g>
      <circle cx="184" cy="22" r="3.5" fill="#5be6c4"/>
    </g>
    <!-- 6: pi cluster -->
    <g transform="translate(176 321)">
      <rect width="200" height="44" rx="6" fill="#11161f" stroke="#2b3645" stroke-width="2"/>
      <g fill="#0a0e14" stroke="#5be6c4" stroke-width="1.5">
        <rect x="18" y="12" width="28" height="20" rx="3"/><rect x="52" y="12" width="28" height="20" rx="3"/><rect x="86" y="12" width="28" height="20" rx="3"/><rect x="120" y="12" width="28" height="20" rx="3"/>
      </g>
      <circle cx="178" cy="22" r="3.5" fill="#f2a65a"/>
    </g>
  </g>

  <!-- unit labels -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5c6677">
    <text x="416" y="83">opnsense</text>
    <text x="416" y="136">unifi sw</text>
    <text x="416" y="189">docker host</text>
    <text x="416" y="242">pve cluster</text>
    <text x="416" y="295">truenas</text>
    <text x="416" y="348">pi &#215;5</text>
  </g>
  <!-- uplink hint -->
  <g stroke="#2b3645" stroke-width="2" stroke-dasharray="4 6" fill="none">
    <path d="M 402 131 H 470 V 84 H 540"/>
  </g>
  <circle cx="540" cy="84" r="4" fill="#5be6c4"/>

  <text x="340" y="424" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="18" letter-spacing="4">// the digital forge</text>
</svg>
