<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Retention Platform">
  <defs>
    <radialGradient id="glow" cx="22%" cy="0%" r="85%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#5be6c4"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#0a0e14"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- port-out signal -->
  <g transform="translate(128 245)">
    <rect x="-52" y="-82" width="104" height="164" rx="18" fill="#11161f" stroke="#5be6c4" stroke-width="4"/>
    <rect x="-37" y="-62" width="74" height="110" rx="5" fill="#0a0e14"/>
    <path d="M -18 0 H 16 M 5 -12 L 19 0 L 5 12" fill="none" stroke="#f2a65a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="64" r="6" fill="#2b3645"/>
  </g>

  <!-- guided case journey -->
  <g fill="none" stroke="#2b3645" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)">
    <path d="M 190 245 H 272"/>
    <path d="M 374 245 H 432"/>
    <path d="M 534 245 H 594"/>
  </g>

  <!-- queue -->
  <g transform="translate(323 245)">
    <rect x="-51" y="-55" width="102" height="110" rx="14" fill="#11161f" stroke="#5be6c4" stroke-width="3.5"/>
    <g stroke="#5be6c4" stroke-width="4" stroke-linecap="round">
      <line x1="-25" y1="-22" x2="25" y2="-22"/><line x1="-25" y1="0" x2="25" y2="0"/><line x1="-25" y1="22" x2="10" y2="22"/>
    </g>
  </g>

  <!-- agent contact -->
  <g transform="translate(483 245)" fill="none" stroke="#97a1b0" stroke-width="4">
    <circle cx="0" cy="-18" r="21"/>
    <path d="M -36 44 a 36 32 0 0 1 72 0"/>
    <path d="M -29 -16 a 29 29 0 0 1 58 0" stroke="#5be6c4" stroke-width="6" stroke-linecap="round"/>
    <path d="M 28 0 q 5 21 -15 26" stroke="#5be6c4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- offer & fulfilment -->
  <g transform="translate(646 245)">
    <path d="M -52 -35 H 52 V 16 L 24 44 H -52 Z" fill="#11161f" stroke="#f2a65a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 24 16 V 44 M 24 16 H 52" fill="none" stroke="#f2a65a" stroke-width="3.5"/>
    <path d="M -28 0 l 14 14 l 30 -32" fill="none" stroke="#5be6c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="452" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="4">// intent → queue → retain → fulfil</text>
</svg>
