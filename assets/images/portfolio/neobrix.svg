<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="NeoBrix desktop environment">
  <defs>
    <radialGradient id="glow" cx="22%" cy="0%" r="85%">
      <stop offset="0" stop-color="#5be6c4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5be6c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0e14"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- desktop frame with neo-brutalist hard shadow -->
  <rect x="177" y="96" width="446" height="268" fill="#263040"/>
  <rect x="164" y="83" width="446" height="268" fill="#11161f" stroke="#5be6c4" stroke-width="5"/>
  <rect x="182" y="104" width="410" height="42" fill="#0a0e14" stroke="#2b3645" stroke-width="3"/>
  <g fill="#5be6c4"><rect x="198" y="119" width="12" height="12"/><rect x="218" y="119" width="12" height="12"/></g>
  <rect x="488" y="115" width="86" height="20" fill="#f2a65a"/>

  <!-- modular shell blocks -->
  <rect x="182" y="149" width="102" height="185" fill="#0a0e14" stroke="#2b3645" stroke-width="3"/>
  <g fill="#5be6c4"><rect x="199" y="169" width="68" height="13"/><rect x="199" y="198" width="48" height="13"/><rect x="199" y="227" width="60" height="13"/></g>
  <rect x="301" y="165" width="132" height="74" fill="#5be6c4"/>
  <rect x="313" y="177" width="75" height="12" fill="#0a0e14"/>
  <rect x="313" y="202" width="104" height="12" fill="#263040"/>
  <rect x="449" y="165" width="126" height="74" fill="#f2a65a"/>
  <g fill="#0a0e14"><rect x="463" y="179" width="42" height="12"/><rect x="463" y="204" width="88" height="12"/></g>
  <rect x="301" y="255" width="274" height="79" fill="#0a0e14" stroke="#2b3645" stroke-width="3"/>
  <g fill="#97a1b0" font-family="ui-monospace,Menlo,monospace" font-size="14"><text x="320" y="284">$ neobrix</text><text x="320" y="310">hyprland · quickshell</text></g>

  <path d="M 348 351 H 426 L 449 390 H 325 Z" fill="#11161f" stroke="#5be6c4" stroke-width="4"/>
  <rect x="265" y="390" width="246" height="16" fill="#5be6c4"/>
  <text x="400" y="452" text-anchor="middle" fill="#5c6677" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="4">// neobrix · modular desktop</text>
</svg>
